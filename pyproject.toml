[project]
name = "pulse-qc"
version = "0.1.0"
description = "Data-quality gating and beat-detection evaluation for open pulsatile physiological waveforms (PPG, ABP, ICP)."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
authors = [{ name = "Nima Pourtaheri" }]
dependencies = [
    "wfdb>=4.1",
    "neurokit2>=0.2.10",
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "typer>=0.12",
]

[project.scripts]
pulse-qc = "pulse_qc.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pulse_qc"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]

[tool.ruff.lint.per-file-ignores]
"src/pulse_qc/cli.py" = ["B008"]  # typer declares options in defaults by design

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore:The inplace keyword:DeprecationWarning",
    "ignore::DeprecationWarning:wfdb",
    "ignore::FutureWarning:wfdb",
]
