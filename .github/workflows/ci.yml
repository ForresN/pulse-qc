name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install
        run: uv sync --all-groups --locked
      - name: Lint
        run: uv run ruff check src tests examples && uv run ruff format --check src tests examples
      - name: Test (synthetic fixtures only, no PhysioNet access)
        run: uv run pytest -q
